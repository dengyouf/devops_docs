apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-cm
data:
  kibana.yml: |
    server.host: 0.0.0.0
    server.shutdownTimeout: 5s
    i18n.locale: "zh-CN"
    elasticsearch.hosts: [http://elastic:9200]
    monitoring.ui.container.elasticsearch.enabled: true
    elasticsearch.username: kibana_system
    elasticsearch.password: kibana@123

